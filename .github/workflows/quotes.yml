name: Update stock quotes
on:
  schedule:
    - cron: "*/5 * * * 1-5"   # every 5 min on weekdays (GitHub may delay runs)
  workflow_dispatch:
permissions:
  contents: write
concurrency: quotes
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_quotes.py
      - name: Commit if changed
        run: |
          git config user.name "quotes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git diff --cached --quiet || (git commit -m "Update quotes" && git push)
