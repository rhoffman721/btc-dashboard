name: Update QQQ history
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC weekdays, after the US cash close
  workflow_dispatch:
permissions:
  contents: write
concurrency: qqq
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_qqq.py
      - name: Commit if changed
        run: |
          git config user.name "quotes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qqq.json
          git diff --cached --quiet || (git commit -m "Update QQQ history" && git push)
